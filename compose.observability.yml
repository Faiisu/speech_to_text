services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TELEMETRY_DATABASE:-speech_telemetry}
      POSTGRES_USER: ${TELEMETRY_ADMIN_USER:-telemetry_admin}
      POSTGRES_PASSWORD: ${TELEMETRY_ADMIN_PASSWORD:?Set TELEMETRY_ADMIN_PASSWORD in .env}
      TELEMETRY_WRITER_PASSWORD: ${TELEMETRY_WRITER_PASSWORD:?Set TELEMETRY_WRITER_PASSWORD in .env}
      TELEMETRY_GRAFANA_PASSWORD: ${TELEMETRY_GRAFANA_PASSWORD:?Set TELEMETRY_GRAFANA_PASSWORD in .env}
      SPEECH_TO_TEXT_TELEMETRY_RETENTION_DAYS: ${SPEECH_TO_TEXT_TELEMETRY_RETENTION_DAYS:-30}
    ports:
      - "127.0.0.1:${TELEMETRY_DATABASE_PORT:-5433}:5432"
    volumes:
      - telemetry-database:/var/lib/postgresql/data
      - ./deploy/observability/postgres-init/00-create-roles.sh:/docker-entrypoint-initdb.d/00-create-roles.sh:ro
      - ./speech_to_text/features/system_observability/migrations/001_initial.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./speech_to_text/features/system_observability/migrations/002_retention_updates.sql:/docker-entrypoint-initdb.d/02-retention-updates.sql:ro
      - ./deploy/observability/postgres-init/02-retention.sh:/docker-entrypoint-initdb.d/03-retention.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      TELEMETRY_DATABASE: ${TELEMETRY_DATABASE:-speech_telemetry}
      TELEMETRY_DATABASE_HOST: timescaledb:5432
      TELEMETRY_GRAFANA_USER: telemetry_grafana
      TELEMETRY_GRAFANA_PASSWORD: ${TELEMETRY_GRAFANA_PASSWORD:?Set TELEMETRY_GRAFANA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - telemetry-grafana:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  telemetry-database:
  telemetry-grafana:
