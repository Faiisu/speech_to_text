# The station service (production_server.py) is deliberately NOT here: the
# OpenVINO GPU plugin has to match the host's i915 driver, and an image that
# drifts from the host is the usual way an iGPU deploy breaks. It runs on the
# host as a systemd unit — see deploy/install.sh. Only the database and its
# query API are containerised.
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sttdemo
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/sttdemo
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
