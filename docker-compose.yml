services:
  # Linux profile (Production target: Intel GPU passthrough, ALSA/PipeWire host audio)
  speech-service:
    profiles: ["linux", "production"]
    image: ${SPEECH_TO_TEXT_IMAGE:-ghcr.io/faiisu/speech-to-text:latest}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${HOST_UID:-1001}
        APP_GID: ${HOST_GID:-1001}
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    command: ["--host", "0.0.0.0", "--port", "${CONTROL_CENTER_PORT:-8765}"]
    ports:
      - "0.0.0.0:${SPEECH_TO_TEXT_HOST_PORT:-18765}:${CONTROL_CENTER_PORT:-8765}"
    environment:
      CONTROL_CENTER_PORT: ${CONTROL_CENTER_PORT:-8765}
      SPEECH_TO_TEXT_MODELS_DIR: /app/models
      HF_HOME: /home/speech/.cache/huggingface
      XDG_CACHE_HOME: /home/speech/.cache
      XDG_RUNTIME_DIR: /run/user/${HOST_UID:-1001}
    group_add:
      - "${RENDER_GID:-992}"
      - "${AUDIO_GID:-29}"
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
    volumes:
      # Models are baked into /app/models inside the image. Uncomment below to override with host models (e.g. ./models or ./legacies-poc/models):
      # - ${SPEECH_TO_TEXT_MODELS_DIR:-./models}:/app/models
      - ./.cache/huggingface:/home/speech/.cache/huggingface
      - type: bind
        source: /run/user/${HOST_UID:-1001}
        target: /run/user/${HOST_UID:-1001}
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + __import__('os').getenv('CONTROL_CENTER_PORT', '8765') + '/api/system', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Mac profile (Development & testing: native ARM64, host microphone bridge)
  speech-service-mac:
    profiles: ["mac", "dev"]
    image: ${SPEECH_TO_TEXT_MAC_TEST_IMAGE:-speech-to-text:mac-test}
    platform: ${MAC_TEST_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${HOST_UID:-1001}
        APP_GID: ${HOST_GID:-1001}
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    command: ["--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "0.0.0.0:${MAC_TEST_CONTROL_CENTER_PORT:-18766}:8765"
    environment:
      CONTROL_CENTER_PORT: "8765"
      SPEECH_TO_TEXT_MODELS_DIR: /app/models
      SPEECH_TO_TEXT_HOST_MICROPHONE_BRIDGE: "1"
      SPEECH_TO_TEXT_HOST_MICROPHONE_BRIDGE_URL: http://127.0.0.1:${MAC_TEST_MICROPHONE_BRIDGE_PORT:-18767}/api
      HF_HOME: /home/speech/.cache/huggingface
      XDG_CACHE_HOME: /home/speech/.cache
    volumes:
      # Models are baked into /app/models inside the image. Uncomment below to override with host models (e.g. ./models or ./legacies-poc/models):
      # - ${SPEECH_TO_TEXT_MODELS_DIR:-./models}:/app/models:ro
      - ./.cache/huggingface:/home/speech/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + __import__('os').getenv('CONTROL_CENTER_PORT', '8765') + '/api/system', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
