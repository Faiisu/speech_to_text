services:
  speech-service:
    image: ${SPEECH_TO_TEXT_MAC_TEST_IMAGE:-speech-to-text:mac-test}
    platform: ${MAC_TEST_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: Dockerfile.mac-test
      args:
        APP_UID: ${HOST_UID:-1001}
        APP_GID: ${HOST_GID:-1001}
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    depends_on:
      timescaledb:
        condition: service_healthy
    entrypoint:
      - python
      - -m
      - uvicorn
      - speech_to_text.control_center.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    command: []
    environment:
      CONTROL_CENTER_PORT: "8765"
      SPEECH_TO_TEXT_MODELS_DIR: /app/models
      SPEECH_TO_TEXT_MODEL_VOLUME_PATH: /app/models
      SPEECH_TO_TEXT_TELEMETRY_DATABASE_URL: postgresql://telemetry_writer:${TELEMETRY_WRITER_PASSWORD:?Set TELEMETRY_WRITER_PASSWORD in .env}@timescaledb:5432/${TELEMETRY_DATABASE:-speech_telemetry}
      SPEECH_TO_TEXT_TELEMETRY_RETENTION_DAYS: ${SPEECH_TO_TEXT_TELEMETRY_RETENTION_DAYS:-30}
      HF_HOME: /home/speech/.cache/huggingface
      XDG_CACHE_HOME: /home/speech/.cache
    ports:
      - "127.0.0.1:${MAC_TEST_CONTROL_CENTER_PORT:-18766}:8765"
    volumes:
      - ${SPEECH_TO_TEXT_MODELS_DIR:-./models}:/app/models:ro
      - ./.cache/huggingface:/home/speech/.cache/huggingface

  timescaledb:
    ports: !override
      - "127.0.0.1:${MAC_TEST_TELEMETRY_DATABASE_PORT:-15433}:5432"

  grafana:
    ports: !override
      - "127.0.0.1:${MAC_TEST_GRAFANA_PORT:-13001}:3000"
